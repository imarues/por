name: Temporary signer readiness and encrypted dispatch
on:
  workflow_dispatch:
  repository_dispatch:
    types: [por-sign-encrypted-v1]
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || vars.POR_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify private signing inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CERT_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/por-private/signer"
          cd "$RUNNER_TEMP/por-private"
          for f in prepare-and-sign-budget.sh sign.sh normalize-external-p12.sh fetch-zsign.sh archive-release.sh; do
            gh api "repos/imarues/cert/contents/signer/$f?ref=bc7c2d111defcb43d1c91cae644bb8939c5f3aee" --jq .content | base64 -d > "signer/$f"
            bash -n "signer/$f"
          done
          gh release view app --repo imarues/cert --json assets --jq '.assets | length >= 6' | grep -qx true
          echo 'Private signer files and release access verified.'
      - name: Verify encryption secret without exposing it
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          POR_SIGNING_KEY: ${{ secrets.POR_SIGNING_KEY }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const secret = process.env.POR_SIGNING_KEY || '';
          const example = 'a7f3c9e2b814d065e92f7a3c6d108b54f9e2c7a16b835d04e6f19c2a78d5b301';
          if (!/^[a-fA-F0-9]{64}$/.test(secret)) throw Error('Expected a 256-bit hexadecimal key');
          if (secret.toLowerCase() === example) console.log('Example key accepted for synthetic readiness test only.');
          const key = Buffer.from(secret, 'hex');
          const iv = crypto.randomBytes(12);
          const c = crypto.createCipheriv('aes-256-gcm', key, iv);
          c.setAAD(Buffer.from('imarues/por:v1'));
          const data = Buffer.concat([c.update('synthetic readiness probe'),c.final()]);
          const d = crypto.createDecipheriv('aes-256-gcm', key, iv);
          d.setAAD(Buffer.from('imarues/por:v1'));
          d.setAuthTag(c.getAuthTag());
          if (Buffer.concat([d.update(data),d.final()]).toString() !== 'synthetic readiness probe') throw Error('Encryption self-test failed');
          console.log('Encryption readiness verified (no customer data used).');
          NODE
      - name: Execute authenticated signing job
        id: sign
        if: github.event_name == 'repository_dispatch' && vars.POR_LIVE_ENABLED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CERT_READ_TOKEN }}
          POR_SIGNING_KEY: ${{ secrets.POR_SIGNING_KEY }}
          POR_ARCHIVE_ENABLED: ${{ vars.POR_ARCHIVE_ENABLED }}
          POR_ARCHIVE_KEY: ${{ secrets.POR_ARCHIVE_KEY }}
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/por-private"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');
          async function main() {
            if (Date.now() >= Date.parse('2026-12-01T00:00:00Z')) throw Error('Temporary signing period ended');
            const key = process.env.POR_SIGNING_KEY || '';
            if (!/^[a-fA-F0-9]{64}$/.test(key) || key.toLowerCase() === 'a7f3c9e2b814d065e92f7a3c6d108b54f9e2c7a16b835d04e6f19c2a78d5b301') throw Error('Invalid signing key configuration');
            const p = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).client_payload;
            const iv = Buffer.from(p.iv || '', 'base64');
            const encrypted = Buffer.from(p.ciphertext || '', 'base64');
            if (iv.length !== 12 || encrypted.length <= 16 || encrypted.length > 4096) throw Error('Invalid envelope');
            const d = crypto.createDecipheriv('aes-256-gcm', Buffer.from(key, 'hex'), iv);
            d.setAAD(Buffer.from('imarues/por:v1'));
            d.setAuthTag(encrypted.subarray(-16));
            const v = JSON.parse(Buffer.concat([d.update(encrypted.subarray(0,-16)),d.final()]));
            const allowed = ['KSign','ESign','BatSign','NeoSign','GBox','LCSign'];
            if (!Number.isFinite(v.issued_at) || Math.abs(Date.now()-v.issued_at)>30*60*1000 || !/^[A-Za-z0-9-]{1,128}$/.test(v.job_id) || !/^[a-f0-9]{64}$/.test(v.job_token) || !/^[A-Za-z0-9-]{16,64}$/.test(v.udid) || !/^\d+$/.test(v.redemption_id) || !Array.isArray(v.apps) || !v.apps.length || !v.apps.every(x=>allowed.includes(x))) throw Error('Invalid job');
            const base = 'https://ikira-flare-bot.kiraplus.workers.dev';
            if (v.worker_base !== base) throw Error('Invalid callback origin');
            const env = {...process.env, GITHUB_REPOSITORY:'imarues/cert', WORKER_BASE:base, JOB_ID:v.job_id, JOB_TOKEN:v.job_token, UDID:v.udid, REDEMPTION_ID:v.redemption_id, EXTERNAL_SIGNING:String(v.external_signing===true), NO_CERT_INJECTION:String(v.no_cert_injection===true), SIGN_APPS:v.apps.join(','), SIGNER_BASE_DIR:process.cwd()+'/signer/runtime', RELEASE_STORAGE_ENABLED:'false'};
            const archiveKey = process.env.POR_ARCHIVE_KEY || '';
            const archiveEnabled = process.env.POR_ARCHIVE_ENABLED === 'true';
            const archiveSafe = archiveEnabled && /^[a-fA-F0-9]{64}$/.test(archiveKey) && archiveKey.toLowerCase() !== key.toLowerCase() && new Set(archiveKey.toLowerCase()).size >= 10 && archiveKey.toLowerCase() !== 'a7f3c9e2b814d065e92f7a3c6d108b54f9e2c7a16b835d04e6f19c2a78d5b301';
            const source = process.env.RUNNER_TEMP+'/por-archive-source';
            const dest = process.env.RUNNER_TEMP+'/por-encrypted-archive';
            if (archiveSafe && new Set(v.apps).size === 6) {
              fs.mkdirSync(source,{mode:0o700,recursive:true});
              const script = 'signer/sign.sh';
              const original = fs.readFileSync(script,'utf8');
              const anchor = '  rm -rf "${WORK_DIR}" || true';
              const capture = '  if [ "$rc" -eq 0 ] && [ "$SUCCESS" -eq 1 ]; then\n    for app in KSign ESign BatSign NeoSign GBox LCSign; do\n      test -s "$WORK_DIR/$app/${app}_signed.ipa" || continue\n      mv -- "$WORK_DIR/$app/${app}_signed.ipa" "$POR_ARCHIVE_SOURCE/$app.ipa" || true\n    done\n  fi\n';
              if (original.split(anchor).length !== 2) throw Error('Archive capture hook changed');
              fs.writeFileSync(script,original.replace(anchor,capture+anchor));
              env.POR_ARCHIVE_SOURCE=source;
            }
            delete env.POR_ARCHIVE_KEY;
            delete env.POR_ARCHIVE_ENABLED;
            delete env.POR_SIGNING_KEY;
            delete env.RELEASE_STORAGE_TOKEN;
            // Never print subprocess output in a public Actions log.
            const run = cp.spawnSync('timeout',['--signal=TERM','--kill-after=3s','80s','bash','signer/prepare-and-sign-budget.sh'],{env,stdio:'ignore',timeout:87000});
            if (run.status !== 0) {
              await fetch(base+'/internal/signing/jobs/'+v.job_id+'/fail',{method:'POST',headers:{Authorization:'Bearer '+v.job_token,'Content-Type':'application/json'},body:JSON.stringify({error:'Temporary signer failed'}),signal:AbortSignal.timeout(8000)}).catch(()=>{});
              throw Error('Signing job failed');
            }
            console.log('Signing job finished; result delivered through authenticated callback.');
            if (archiveEnabled && !archiveSafe) console.log('::warning::Archive key is missing or unsuitable; R2 originals retained.');
            if (archiveSafe && new Set(v.apps).size === 6) {
              const apps = ['KSign','ESign','BatSign','NeoSign','GBox','LCSign'];
              const {pipeline} = require('node:stream/promises');
              const {Readable} = require('node:stream');
              try {
                if (!apps.every(app=>fs.existsSync(source+'/'+app+'.ipa'))) throw Error('Incomplete batch');
                fs.mkdirSync(dest,{mode:0o700,recursive:true});
                async function encrypt(input,file) {
                  const iv = crypto.randomBytes(12);
                  const cipher = crypto.createCipheriv('aes-256-gcm',Buffer.from(archiveKey,'hex'),iv);
                  cipher.setAAD(Buffer.from('PORARC01'));
                  fs.writeFileSync(file,Buffer.concat([Buffer.from('PORARC01'),iv]),{mode:0o600});
                  await pipeline(input,cipher,fs.createWriteStream(file,{flags:'a',mode:0o600}));
                  fs.appendFileSync(file,cipher.getAuthTag());
                }
                const entries=[];
                for(let i=0;i<apps.length;i++){
                  const app=apps[i], name='part-'+String(i+1).padStart(2,'0')+'.enc';
                  await encrypt(fs.createReadStream(source+'/'+app+'.ipa'),dest+'/'+name);
                  entries.push({app,file:name});
                }
                await encrypt(Readable.from([Buffer.from(JSON.stringify({version:1,job_id:v.job_id,redemption_id:v.redemption_id,udid:v.udid,apps:entries}))]),dest+'/manifest.enc');
                fs.appendFileSync(process.env.GITHUB_OUTPUT,'archive_ready=true\n');
                console.log('Encrypted backup batch ready; no plaintext will be uploaded.');
              } catch {
                fs.rmSync(dest,{recursive:true,force:true});
                console.log('::warning::Backup preparation failed; R2 originals retained.');
              } finally {fs.rmSync(source,{recursive:true,force:true});}
            }

          }
          main().catch(()=>{console.error('Temporary signer failed validation or execution.');process.exitCode=1;});
          NODE
      - name: Transfer encrypted backup to separate archive run
        if: success() && steps.sign.outputs.archive_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: por-encrypted-archive
          path: ${{ runner.temp }}/por-encrypted-archive/*.enc
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/por-private" "$RUNNER_TEMP/zsign-extract" "$RUNNER_TEMP/zsign.tar.gz" "$RUNNER_TEMP/por-archive-source" "$RUNNER_TEMP/por-encrypted-archive"
